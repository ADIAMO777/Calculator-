<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#151a17" />
    <title>Canon Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="wordmark" href="#" aria-label="Canon Calculator home">
          <span class="wordmark-icon" aria-hidden="true">C</span>
          <span>CANON CALCULATOR</span>
        </a>
      </header>

      <section class="calculator" aria-labelledby="calculator-title">
        <div class="calculator-topline">
          <h1 id="calculator-title">Calculator</h1>
        </div>

        <div
          class="display"
          aria-label="Calculator display"
          aria-live="polite"
          aria-atomic="true"
        >
          <p class="expression" id="expression">Ready</p>
          <output class="result" id="display">0</output>
        </div>

        <div class="keypad" id="keypad" aria-label="Calculator keys">
          <button class="key key-utility" type="button" data-action="clear">
            AC
          </button>
          <button
            class="key key-utility"
            type="button"
            data-action="delete"
            aria-label="Delete last digit"
          >
            DEL
          </button>
          <button
            class="key key-utility"
            type="button"
            data-action="percent"
            aria-label="Percent"
          >
            %
          </button>
          <button
            class="key key-operator"
            type="button"
            data-value="/"
            aria-label="Divide"
          >
            ÷
          </button>

          <button class="key" type="button" data-value="7">7</button>
          <button class="key" type="button" data-value="8">8</button>
          <button class="key" type="button" data-value="9">9</button>
          <button
            class="key key-operator"
            type="button"
            data-value="*"
            aria-label="Multiply"
          >
            ×
          </button>

          <button class="key" type="button" data-value="4">4</button>
          <button class="key" type="button" data-value="5">5</button>
          <button class="key" type="button" data-value="6">6</button>
          <button
            class="key key-operator"
            type="button"
            data-value="-"
            aria-label="Subtract"
          >
            −
          </button>

          <button class="key" type="button" data-value="1">1</button>
          <button class="key" type="button" data-value="2">2</button>
          <button class="key" type="button" data-value="3">3</button>
          <button
            class="key key-operator"
            type="button"
            data-value="+"
            aria-label="Add"
          >
            +
          </button>

          <button
            class="key key-utility"
            type="button"
            data-action="sign"
            aria-label="Change sign"
          >
            ±
          </button>
          <button class="key key-zero" type="button" data-value="0">0</button>
          <button class="key" type="button" data-value=".">.</button>
          <button
            class="key key-equals"
            type="button"
            data-action="calculate"
            aria-label="Calculate"
          >
            =
          </button>
        </div>

        <p class="keyboard-hint">
          <kbd>Enter</kbd> calculate <span>·</span> <kbd>Esc</kbd> clear
          <span>·</span> <kbd>Backspace</kbd> delete
        </p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
